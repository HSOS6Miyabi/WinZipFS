name: Windows build and integration tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install WinFsp and 7-Zip
        shell: pwsh
        run: ./scripts/install-dependencies.ps1
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/vcpkg" fetch --depth 1 origin e6d62cc9ce8f8d9687df14521118f2ec3c10ee6a
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WZ_VCPKG=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-x64-vcpkg-e6d62cc9-${{ hashFiles('vcpkg.json') }}
      - name: Build native core
        id: core-build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:WZ_VCPKG/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'C:\Program Files\7-Zip\7z.dll' build/Release/
      - name: Save vcpkg binary packages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-x64-vcpkg-e6d62cc9-${{ hashFiles('vcpkg.json') }}
      - name: Native API tests
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Real WinFsp volume integration tests
        id: integration
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        shell: pwsh
        run: |
          ./tests/fixtures.ps1
          & build/Release/core-tests.exe (Resolve-Path artifacts/fixtures)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build WinUI 3
        id: ui-build
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        shell: pwsh
        run: |
          msbuild ui/WinZipFS.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/Release/WinZipFSCore.dll artifacts/app/
          Copy-Item 'C:\Program Files\7-Zip\7z.dll' artifacts/app/
          Copy-Item 'C:\Program Files\7-Zip\License.txt' artifacts/app/7-Zip-License.txt
          Copy-Item LICENSE artifacts/app/WinZipFS-License.txt
          Get-ChildItem build/vcpkg_installed/x64-windows/share/bit7z/copyright | Copy-Item -Destination artifacts/app/bit7z-License.txt
      - name: WinUI and notification area automation
        if: ${{ !cancelled() && steps.ui-build.outcome == 'success' && steps.integration.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/ui_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-test-results
          path: |
            artifacts/test-results/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: WinZipFS-windows-x64
          path: artifacts/app/
          if-no-files-found: error
